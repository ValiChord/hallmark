# Render blueprint for the RAF Workbench demo.
#
# In Render: New > Blueprint, point it at this repository, and it reads this file.
# The repository is private, so Render needs GitHub access to the ValiChord org.
#
# No conductor is involved. The demo runs the attestation rules in the browser,
# so this is a plain Node web service and nothing else.
services:
  - type: web
    name: raf-workbench
    runtime: node
    plan: free
    rootDir: demo
    buildCommand: npm ci && npm run build
    startCommand: node .output/server/index.mjs
    envVars:
      # Build a portable Node server instead of the Vercel preset.
      - key: SERVER_PRESET
        value: node-server

      # There is no VITE_AUTH_ENABLED any more. The auth stack it disabled was
      # inherited scaffolding that nothing reached, and it was deleted on
      # 2026-09-01 along with the database and the preview harness. The demo now
      # has no sign-in to switch off. If an old Render environment still carries
      # the variable, it is inert — but delete it, so nobody reads it as a
      # feature that exists.
      - key: NODE_VERSION
        value: "22"
