manifest_version: "0"
name: aviation_provenance

integrity:
  network_seed: null
  # Properties are YAML that deserializes into DnaProperties.
  # initial_members MUST be AgentPubKeyB64 strings (uhCAk...), not raw AgentPubKey bytes.
  # Replace the placeholders at install time with the root authorities' public keys.
  properties:
    initial_members: []
    max_delegation_depth: 2
    # 365 days in microseconds
    max_membership_ttl_micros: 31536000000000
    # NEW / PROTOTYPE / USED are the real Block 11 terms for the airworthiness
    # approval path (FAA Order 8130.21J s4-1(k)). The rest are return-to-service
    # language and remain provisional.
    assertion_vocabulary:
      - NEW
      - PROTOTYPE
      - USED
      - INSPECTED
      - OVERHAULED
      - MODIFIED
      - REPAIRED
      - LIFE_LIMITED_SCRAP
  zomes:
    - name: aviation_attestation_integrity
      path: "target/wasm32-unknown-unknown/release/aviation_attestation_integrity.wasm"

coordinator:
  zomes:
    - name: aviation_attestation_coordinator
      path: "target/wasm32-unknown-unknown/release/aviation_attestation_coordinator.wasm"
      dependencies:
        - name: aviation_attestation_integrity
