name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: zomes build to wasm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust with the wasm target
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup target add wasm32-unknown-unknown
          rustup component add clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: demo/zomes

      # The two required flags live in demo/zomes/.cargo/config.toml, so they
      # apply automatically here. See demo/zomes/BUILD.md for why they exist.
      - name: cargo check
        working-directory: demo/zomes
        run: cargo check --workspace --all-targets

      - name: clippy
        working-directory: demo/zomes
        run: cargo clippy --workspace -- -D warnings

      - name: build wasm
        working-directory: demo/zomes
        run: cargo build --release --target wasm32-unknown-unknown

      - name: the artefacts exist
        working-directory: demo/zomes
        run: |
          ls -la target/wasm32-unknown-unknown/release/*.wasm
          test -f target/wasm32-unknown-unknown/release/aviation_attestation_integrity.wasm
          test -f target/wasm32-unknown-unknown/release/aviation_attestation_coordinator.wasm

      - uses: actions/upload-artifact@v4
        with:
          name: zome-wasm
          path: demo/zomes/target/wasm32-unknown-unknown/release/*.wasm
          if-no-files-found: error

  web:
    name: demo typecheck, lint and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: demo/package-lock.json

      - name: install
        working-directory: demo
        run: npm ci

      - name: typecheck
        working-directory: demo
        run: npm run typecheck

      - name: lint
        working-directory: demo
        run: npm run lint

      - name: tests
        working-directory: demo
        run: npm test

      # The production build, exactly as Render runs it. Without this, a build
      # that only ever succeeded on a developer machine reaches deploy untested.
      - name: production build (node-server preset)
        working-directory: demo
        env:
          SERVER_PRESET: node-server
        run: |
          npm run build
          test -f .output/server/index.mjs

      - name: the built server boots and serves
        working-directory: demo
        run: |
          PORT=8099 node .output/server/index.mjs > boot.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf -o page.html http://127.0.0.1:8099/ && break
            sleep 2
          done
          curl -sf -o page.html http://127.0.0.1:8099/ || { echo "server did not serve"; cat boot.log; exit 1; }
          grep -q "Hallmark" page.html || { echo "unexpected page content"; head -c 400 page.html; exit 1; }
          grep -qi "sign in" page.html && { echo "AUTH IS ON — visitors would hit a login wall"; exit 1; }
          echo "served the workbench with no sign-in"

      # The site shipped a third-party script for weeks without anyone noticing,
      # because nothing looked. Now something looks, on every push.
      - name: no third-party script, and the headers are present
        working-directory: demo
        run: |
          PORT=8098 node .output/server/index.mjs > guard.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf -o guard.html http://127.0.0.1:8098/ && break
            sleep 2
          done
          curl -sf -D guard.headers -o guard.html http://127.0.0.1:8098/ \
            || { echo "server did not serve"; cat guard.log; exit 1; }

          # Google Fonts is the one allowed external origin, and it is a
          # stylesheet, never a script.
          if grep -oE 'src="https?://[^"]+"' guard.html | grep -v 'fonts.gstatic.com'; then
            echo "THIRD-PARTY SCRIPT ON THE PAGE — see the lines above"
            exit 1
          fi

          for h in content-security-policy x-content-type-options referrer-policy \
                   x-frame-options strict-transport-security permissions-policy; do
            grep -qi "^$h:" guard.headers || { echo "missing header: $h"; cat guard.headers; exit 1; }
          done
          grep -qi "frame-ancestors 'none'" guard.headers || { echo "CSP lost frame-ancestors"; exit 1; }
          echo "no third-party scripts; all six security headers present"

  conductor:
    name: end-to-end in a real conductor
    runs-on: ubuntu-latest
    needs: [rust]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/download-artifact@v4
        with:
          name: zome-wasm
          path: demo/zomes/target/wasm32-unknown-unknown/release

      - name: Fetch holochain 0.7.0 binaries
        run: |
          mkdir -p "$HOME/hc-bin"
          cd "$HOME/hc-bin"
          base=https://github.com/holochain/holochain/releases/download/holochain-0.7.0
          curl -fsSL --retry 5 --retry-delay 5 --retry-all-errors -o hc "$base/hc-x86_64-unknown-linux-gnu"
          curl -fsSL --retry 5 --retry-delay 5 --retry-all-errors -o holochain "$base/holochain-x86_64-unknown-linux-gnu"
          chmod +x hc holochain
          ./hc --version
          ./holochain --version
          echo "$HOME/hc-bin" >> "$GITHUB_PATH"

      - name: Pack the DNA and hApp
        working-directory: demo/zomes
        run: |
          hc dna pack .
          hc app pack .

      - name: Install the Holochain client (not a project dependency)
        working-directory: demo
        run: npm install --no-save @holochain/client@^0.21.0

      - name: Start a sandbox conductor
        working-directory: demo/zomes
        run: |
          echo "ci-passphrase" | hc sandbox --piped -f 9000 create --in-process-lair
          echo "ci-passphrase" | hc sandbox --piped -f 9000 run > conductor.log 2>&1 &
          for i in $(seq 1 60); do
            grep -q "Conductor launched" conductor.log && break
            sleep 2
          done
          grep -q "Conductor launched" conductor.log || { echo "conductor did not start"; cat conductor.log; exit 1; }

      - name: Smoke test
        working-directory: demo
        run: node zomes/tests/conductor-smoke.mjs

      # The desktop Revoke tab reads membership and revocation entries by field
      # name. Those names are a contract with the integrity zome, and nothing
      # else would notice if they changed.
      - name: The desktop Revoke tab's contract with the zome
        working-directory: demo
        run: node zomes/tests/revoke-ui-contract.mjs

      - name: Conductor log on failure
        if: failure()
        working-directory: demo/zomes
        run: tail -100 conductor.log || true

  network:
    name: two conductors, one DHT
    runs-on: ubuntu-latest
    needs: [rust]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/download-artifact@v4
        with:
          name: zome-wasm
          path: demo/zomes/target/wasm32-unknown-unknown/release

      - name: Fetch holochain 0.7.0 binaries
        run: |
          mkdir -p "$HOME/hc-bin"
          cd "$HOME/hc-bin"
          base=https://github.com/holochain/holochain/releases/download/holochain-0.7.0
          curl -fsSL --retry 5 --retry-delay 5 --retry-all-errors -o hc "$base/hc-x86_64-unknown-linux-gnu"
          curl -fsSL --retry 5 --retry-delay 5 --retry-all-errors -o holochain "$base/holochain-x86_64-unknown-linux-gnu"
          chmod +x hc holochain
          echo "$HOME/hc-bin" >> "$GITHUB_PATH"

      - name: Pack the DNA and hApp
        working-directory: demo/zomes
        run: |
          hc dna pack .
          hc app pack .

      - name: Install the Holochain client
        working-directory: demo
        run: npm install --no-save @holochain/client@^0.21.0

      - name: Start two sandbox conductors
        working-directory: demo/zomes
        run: |
          echo "ci-passphrase" | hc sandbox --piped -f 9000,9001 create -n 2 --in-process-lair
          echo "ci-passphrase" | hc sandbox --piped -f 9000,9001 run --all > network.log 2>&1 &
          for i in $(seq 1 90); do
            [ "$(grep -c 'Conductor launched' network.log 2>/dev/null || echo 0)" -ge 2 ] && break
            sleep 2
          done
          grep -c "Conductor launched" network.log
          [ "$(grep -c 'Conductor launched' network.log)" -ge 2 ] || { echo "conductors did not both start"; cat network.log; exit 1; }

      # Proves what a single conductor cannot: gossip between independent nodes,
      # and a third party verifying a record without contacting its author.
      - name: Two-conductor gossip test
        working-directory: demo
        env:
          GOSSIP_TIMEOUT_MS: "240000"
        run: node zomes/tests/network-gossip.mjs

      - name: Conductor log on failure
        if: failure()
        working-directory: demo/zomes
        run: tail -150 network.log || true
